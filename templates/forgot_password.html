{% extends "base.html" %}
{% block title %}Reset Password — BarangayConnect{% endblock %}
{% block auth_content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="brand-mark">BC</span>
      <div><strong style="font-family:var(--font-display); color:var(--navy)">BarangayConnect</strong></div>
    </div>
    <h1>Reset your password</h1>
    <p class="auth-sub">Enter your email address and we’ll send password reset instructions if an active account matches.</p>
    <form method="POST" class="form-grid" id="forgot-password-form">
      <div class="form-row">
        <label>Email address</label>
        <input type="email" name="email" value="{{ email or '' }}" required autofocus>
      </div>
      <button
        class="btn btn-primary btn-block resend-countdown-button"
        type="submit"
        data-resend-countdown
        data-remaining-ms="{{ resend_remaining_ms|default(0) }}"
        data-idle-label="Send Reset Code"
        {% if resend_remaining_ms|default(0) > 0 %}disabled{% endif %}
      >{% if resend_remaining_ms|default(0) > 0 %}Resend Email in {{ resend_countdown }}{% else %}Send Reset Code{% endif %}</button>
    </form>
    <div class="auth-foot"><a href="{{ url_for('login') }}">Back to login</a></div>
  </div>
</div>
<script src="{{ url_for('static', filename='js/password-reset-countdown.js') }}"></script>
<script>
  document.getElementById("forgot-password-form").addEventListener("submit", function () {
    const button = this.querySelector("button[type='submit']");
    button.disabled = true;
    button.textContent = "Sending...";
  });
</script>
{% endblock %}
