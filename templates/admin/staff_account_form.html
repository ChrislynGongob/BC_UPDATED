{% extends "base.html" %}
{% block title %}Edit Staff Account — BarangayConnect{% endblock %}
{% block page_title %}Edit Staff Account{% endblock %}
{% block content %}
<div class="card" style="max-width:720px">
  <form method="POST" class="form-grid">
    <div class="form-row"><label for="staff-full-name">Full name</label><input id="staff-full-name" name="full_name" maxlength="120" value="{{ account.full_name }}" required></div>
    <div class="form-row"><label for="staff-email">Email</label><input id="staff-email" type="email" name="email" value="{{ account.email }}" required></div>
    <div class="form-row"><label for="staff-mobile">Mobile number</label><input id="staff-mobile" type="tel" name="contact_number" value="{{ account.contact_number or '' }}" placeholder="0917 123 4567"></div>
    <div class="form-row"><label for="staff-office">Office</label><select id="staff-office" name="office" required>{% for key,cfg in offices.items() %}<option value="{{ key }}" {{ 'selected' if account.office==key }}>{{ cfg.label }}</option>{% endfor %}</select></div>
    <div class="actions-row"><button class="btn btn-primary" type="submit">Save Changes</button><a class="btn btn-outline" href="{{ url_for('user_role_administration', role='staff', status='all') }}">Cancel</a></div>
  </form>
</div>
{% endblock %}
